<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Add Patient</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <div class="main-content">

        <h1>Add Patient</h1>

        <p>Enter patient details</p>

        <form id="patientForm">

            <div>
                <label>Name</label>
                <input
                    type="text"
                    id="name"
                    required
                >
            </div>

            <div>
                <label>Age</label>
                <input
                    type="number"
                    id="age"
                    required
                >
            </div>

            <div>
                <label>Gender</label>

                <select id="gender" required>
                    <option value="">Select Gender</option>
                    <option value="Male">Male</option>
                    <option value="Female">Female</option>
                    <option value="Other">Other</option>
                </select>
            </div>

            <div>
                <label>Phone</label>
                <input
                    type="text"
                    id="phone"
                    required
                >
            </div>

            <div>
                <label>Email</label>
                <input
                    type="email"
                    id="email"
                >
            </div>

            <div>
                <label>Address</label>
                <input
                    type="text"
                    id="address"
                >
            </div>

            <div>
                <label>Blood Group</label>

                <select id="blood_group" required>
                    <option value="">Select Blood Group</option>
                    <option value="A+">A+</option>
                    <option value="A-">A-</option>
                    <option value="B+">B+</option>
                    <option value="B-">B-</option>
                    <option value="O+">O+</option>
                    <option value="O-">O-</option>
                    <option value="AB+">AB+</option>
                    <option value="AB-">AB-</option>
                </select>
            </div>

            <br>

            <button type="submit">
                Add Patient
            </button>

        </form>

        <p id="message"></p>

    </div>

    <script src="js/add-patient.js"></script>

</body>

</html>
